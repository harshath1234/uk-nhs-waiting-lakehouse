[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uk-nhs-waiting-lakehouse"
version = "0.1.0"
description = "NHS England RTT and A&E waiting times: Azure landing, Databricks medallion, Snowflake marts, Power BI"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
spark = ["pyspark>=3.5"]
dev = ["pytest>=8", "ruff>=0.6", "pyspark>=3.5"]

[tool.setuptools.packages.find]
where = ["ingest/src", "databricks/src"]

[tool.pytest.ini_options]
testpaths = ["ingest/tests", "databricks/tests"]
pythonpath = ["ingest/src", "databricks/src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"databricks/notebooks/*.py" = ["F821", "E402", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["nhs_lakehouse", "nhs_ingest", "conftest"]
